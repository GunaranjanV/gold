<!DOCTYPE html>
<html>
<head>
  <title>Gold Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #fff8dc, #f5deb3);
      color: #4b3e2a;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #b8860b;
      font-size: 36px;
      margin-bottom: 20px;
      text-align: center;
      text-shadow: 1px 1px 2px #fff;
    }

    label {
      font-weight: bold;
      margin-top: 15px;
      display: block;
    }

    input, select {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #d4af37;
      border-radius: 5px;
      width: 100%;
      max-width: 280px;
      font-size: 16px;
      background-color: #fffaf0;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
    }

    button {
      background-color: #d4af37;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #c5a02e;
    }

    #answer {
      margin-top: 30px;
      font-size: 18px;
      color: #6b4e16;
      background-color: #fff8e1;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #d4af37;
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
      width: 100%;
      max-width: 280px;
    }

    .button-group {
      display: flex;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .clear-button {
      background-color: #f0e68c;
      color: #4b3e2a;
    }

    .clear-button:hover {
      background-color: #e6d26a;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 28px;
      }

      input, select {
        font-size: 14px;
      }

      button {
        font-size: 16px;
        width: 100%;
        max-width: 200px;
      }

      .button-group {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body onload="setDefaults()">

<h1>Gold Calculator</h1>

<div class="form-group">
  <label for="purity">Gold Purity:</label>
  <select id="purity" onchange="setDefaults()">
    <option value="22" selected>22K</option>
    <option value="20">20K</option>
    <option value="18">18K</option>
  </select>
</div>

<div class="form-group">
  <label for="num1">Gross weight</label>
  <input type="text" id="num1">
</div>

<div class="form-group">
  <label for="num2">Non-gold weight</label>
  <input type="text" id="num2" placeholder="e.g. 5%">
</div>

<div class="form-group">
  <label for="num3">Stone weight</label>
  <input type="text" id="num3">
</div>

<div class="form-group">
  <label for="num4">Bank value for 6 month</label>
  <input type="text" id="num4" placeholder="Enter manually">
</div>

<div class="form-group">
  <label for="num5">Bank value for 1 year</label>
  <input type="text" id="num5" placeholder="Enter manually">
</div>

<div class="form-group">
  <label for="market12">Market value for 1 year</label>
  <input type="text" id="market12" placeholder="Enter manually">
</div>

<div class="button-group">
  <button onclick="calculate()">Calculate</button>
  <button onclick="setDefaults()" class="clear-button">Clear</button>
</div>

<div id="answer"></div>

<script>
let totalBank6 = 0;
let totalBank12 = 0;
let totalMarket12 = 0;

function setDefaults() {
  document.getElementById("num1").value = "";
  document.getElementById("num2").value = "";
  document.getElementById("num3").value = "";
  document.getElementById("answer").innerHTML = "";

  var purity = document.getElementById("purity").value;

  if (purity === "18") {
    document.getElementById("num4").value = "6276";
    document.getElementById("num5").value = "5827";
    document.getElementById("market12").value = "8965";
  } else if (purity === "20") {
    document.getElementById("num4").value = "6973";
    document.getElementById("num5").value = "6475";
    document.getElementById("market12").value = "9961";
  } else if (purity === "22") {
    document.getElementById("num4").value = "7670";
    document.getElementById("num5").value = "7122";
    document.getElementById("market12").value = "10957";
  }
}

function calculate() {
  var field1 = parseFloat(document.getElementById("num1").value);
  var rawPercent = document.getElementById("num2").value;
  var field3 = parseFloat(document.getElementById("num3").value);
  var field4 = parseFloat(document.getElementById("num4").value);
  var field5 = parseFloat(document.getElementById("num5").value);
  var market12 = parseFloat(document.getElementById("market12").value);

  var percent = parseFloat(rawPercent.replace('%', ''));

  var netGoldWeight = field1 - (field1 * percent / 100) - field3;
  var loanValue6Month = netGoldWeight * field4;
  var loanValue1Year = netGoldWeight * field5;
  var marketValue1Year = netGoldWeight * market12;

  if (
    !isNaN(netGoldWeight) &&
    !isNaN(loanValue6Month) &&
    !isNaN(loanValue1Year) &&
    !isNaN(marketValue1Year)
  ) {
    totalBank6 += loanValue6Month;
    totalBank12 += loanValue1Year;
    totalMarket12 += marketValue1Year;

    document.getElementById("answer").innerHTML =
      "💰 <strong>Net gold weight:</strong> " + netGoldWeight.toFixed(2) + " grams<br><br>" +
      "🏦 <strong>Bank value for 6 months:</strong> ₹" + loanValue6Month.toFixed(2) + "<br>" +
      "🏦 <strong>Bank value for 1 year:</strong> ₹" + loanValue1Year.toFixed(2) + "<br>" +
      "📈 <strong>Market value for 1 year:</strong> ₹" + marketValue1Year.toFixed(2) + "<br><br>" +
      "🧮 <strong>Grand Total (All Purities):</strong><br>" +
      "🏦 6 Months: ₹" + totalBank6.toFixed(2) + "<br>" +
      "🏦 1 Year: ₹" + totalBank12.toFixed(2) + "<br>" +
      "📈 Market: ₹" + totalMarket12.toFixed(2);
  } else {
    document.getElementById("answer").innerHTML = "⚠️ Please enter valid numbers.";
  }
}
</script>

</body>
</html>
